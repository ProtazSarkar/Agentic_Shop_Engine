      <stop offset="0%" stop-color="#F6F4EF"/>
      <stop offset="100%" stop-color="#E4DFD4"/>
    </radialGradient>
    <linearGradient id="leather" x1="160" y1="200" x2="480" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9A5B3A"/>
      <stop offset="100%" stop-color="#6B3D24"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" rx="28" fill="url(#bg)"/>
  <rect x="148" y="216" width="352" height="236" rx="26" fill="#141413" opacity="0.1"/>
