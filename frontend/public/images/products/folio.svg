  <rect x="140" y="198" width="360" height="240" rx="26" fill="url(#leather)" stroke="#58301B" stroke-width="3"/>
  <!-- Stitching -->
  <rect x="156" y="214" width="328" height="208" rx="18" stroke="#C58B68" stroke-width="2" stroke-dasharray="6 6" opacity="0.7"/>
  <!-- Brass Zip Pull -->
  <rect x="492" y="286" width="24" height="52" rx="6" fill="#D4A656"/>
